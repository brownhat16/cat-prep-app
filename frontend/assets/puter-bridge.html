<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect Puter AI - CAT Master</title>
  <script src="https://js.puter.com/v2/"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f131d;
      color: #c1c7d3;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: rgba(26, 31, 46, 0.8);
      border: 1px solid rgba(164, 201, 255, 0.15);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
    }
    h1 {
      color: #a4c9ff;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    p {
      color: #8b919d;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px;
      background: #a4c9ff;
      color: #0f131d;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    .spinner {
      border: 3px solid rgba(255,255,255,0.1);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border-left-color: #a4c9ff;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="spinner"></div>
    <h1>Initializing Puter Connection</h1>
    <p>Please wait while we set up secure keyless connection...</p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('redirect') || 'frontend://';

    function updateUI(signedIn) {
      const card = document.getElementById('card');
      if (signedIn) {
        const token = localStorage.getItem('puter.auth.token');
        card.innerHTML = `
          <div class="spinner"></div>
          <h1 style="color: #4ade80;">Success! Connected</h1>
          <p>Authenticating your session securely. Redirecting you back to the CAT Master app...</p>
        `;
        setTimeout(() => {
          // If the scheme is frontend:// or an expo redirect URL
          const target = redirectUrl.includes('?') 
            ? `${redirectUrl}&token=${encodeURIComponent(token)}`
            : `${redirectUrl}?token=${encodeURIComponent(token)}`;
          window.location.href = target;
        }, 1500);
      } else {
        card.innerHTML = `
          <div style="font-size: 48px; margin-bottom: 20px;">⚡</div>
          <h1>Connect Puter AI</h1>
          <p>Sign in to your free Puter account to unlock unlimited high-speed AI fallback when Gemini hits rate limits.</p>
          <button class="btn" id="loginBtn">Connect Puter Account</button>
        `;
        document.getElementById('loginBtn').addEventListener('click', function() {
          puter.auth.signIn();
        });
      }
    }

    // Check if already signed in on load
    setTimeout(() => {
      try {
        updateUI(puter.auth.isSignedIn());
      } catch(e) {
        updateUI(false);
      }
    }, 1000);
  </script>
</body>
</html>
