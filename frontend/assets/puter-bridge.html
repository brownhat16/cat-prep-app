<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puter Bridge</title>
  <script src="https://js.puter.com/v2/"></script>
  <style>
    body { margin: 0; background: transparent; font-family: sans-serif; }
  </style>
</head>
<body>
<script>
  // Bridge between React Native and Puter.js
  // React Native sends messages via injectedJavaScript / postMessage
  // This page receives them, calls Puter APIs, and posts results back.

  function sendToRN(type, payload) {
    window.ReactNativeWebView.postMessage(JSON.stringify({ type, payload }));
  }

  // Check auth status on load
  window.addEventListener('load', function() {
    try {
      const signedIn = puter.auth.isSignedIn();
      sendToRN('auth_status', { signedIn: signedIn });
    } catch(e) {
      sendToRN('auth_status', { signedIn: false });
    }
  });

  // Listen for commands from React Native
  window.addEventListener('message', async function(event) {
    try {
      const msg = JSON.parse(event.data);

      if (msg.action === 'sign_in') {
        try {
          await puter.auth.signIn();
          const user = await puter.auth.getUser();
          sendToRN('auth_result', { success: true, username: user.username });
        } catch(e) {
          sendToRN('auth_result', { success: false, error: e.message || 'Sign in cancelled' });
        }
      }

      else if (msg.action === 'sign_out') {
        puter.auth.signOut();
        sendToRN('auth_status', { signedIn: false });
      }

      else if (msg.action === 'check_auth') {
        const signedIn = puter.auth.isSignedIn();
        sendToRN('auth_status', { signedIn: signedIn });
      }

      else if (msg.action === 'chat') {
        const response = await puter.ai.chat(msg.prompt, {
          model: msg.model || 'gpt-4o-mini'
        });

        // response can be a string or object depending on model
        let text = '';
        if (typeof response === 'string') {
          text = response;
        } else if (response && response.message && response.message.content) {
          text = response.message.content;
        } else if (response && response.text) {
          text = response.text;
        } else {
          text = JSON.stringify(response);
        }

        sendToRN('chat_result', { success: true, text: text, requestId: msg.requestId });
      }

    } catch(e) {
      sendToRN('error', { message: e.message || 'Unknown error', requestId: (JSON.parse(event.data)).requestId });
    }
  });

  // Also listen for document-level messages (some WebView implementations use this)
  document.addEventListener('message', function(event) {
    window.dispatchEvent(new MessageEvent('message', { data: event.data }));
  });
</script>
</body>
</html>
