services:
  - type: web
    name: cat-backend
    env: python
    rootDir: backend
    plan: starter
    buildCommand: ./build.sh
    startCommand: ./start.sh
    healthCheckPath: /healthz
    disk:
      name: cat-backend-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: file:/var/data/dev.db
      - key: PINECONE_INDEX_NAME
        value: cat-prep-index
      - key: BACKEND_CORS_ORIGINS
        value: https://your-vercel-project.vercel.app,http://127.0.0.1:3001,http://localhost:3001
